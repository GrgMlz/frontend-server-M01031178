<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>After School Club</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="app">
    <h1>{{ sitename }}</h1>
    <p>
      Sort by:
      <select v-model="sortBy">
        <option value="topic">Subject</option>
        <option value="location">Location</option>
        <option value="price">Price</option>
        <option value="space">Spaces</option>
      </select>

      <select v-model="sortOrder">
        <option value="ascending">Ascending</option>
        <option value="descending">Descending</option>
      </select>
    </p>

    <div v-for="lesson in sortedLessons">
      <img v-bind:src="imageAddress(lesson)" width="100" v-bind:alt="lesson.topic">
      <h2>{{ lesson.topic }}</h2>
      <p>{{ lesson.location }}</p>
      <p>Price: £{{ lesson.price }}</p>
      <p>Spaces: {{ lesson.space }}</p>
      <button v-on:click="addToCart(lesson)" v-bind:disabled="!canAddToCart(lesson)">Add to cart</button>
    </div>
  </div>

  <script type="module">
    const { createApp } = Vue

    const SERVER_URL = "https://backend-server-m01031178.onrender.com"

    const myApp = createApp({
      data() {
        return {
          sitename: "After School Club",
          lessons: [],
          sortBy: "topic",
          sortOrder: "ascending",
          cart: []
        }
      },
      created() {
        this.fetchLessons()
      },
      computed: {
        sortedLessons() {
          const attribute = this.sortBy
          const order = this.sortOrder

          function compare(a, b) {
            if (a[attribute] > b[attribute]) return 1
            if (a[attribute] < b[attribute]) return -1
            return 0
          }

          let sorted = this.lessons.slice().sort(compare)
          if (order === "descending") {
            sorted.reverse()
          }
          return sorted
        }
      },
      methods: {
        async fetchLessons() {
          const url = SERVER_URL + "/lessons"
          let response = await fetch(url)
          this.lessons = await response.json()
        },
        imageAddress(lesson) {
          return SERVER_URL + "/images/" + lesson.image
        },
        addToCart(lesson) {
          if (this.canAddToCart(lesson)) {
            this.cart.push(lesson._id)
            lesson.space--
          }
        },
        canAddToCart(lesson) {
          return lesson.space > 0
        }
      }
    })

    myApp.mount("#app")
  </script>
</body>
</html>
