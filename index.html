<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>After School Club</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="app">
    <h1>{{ sitename }}</h1>

    <div v-for="lesson in lessons">
      <img v-bind:src="imageAddress(lesson)" width="100" v-bind:alt="lesson.topic">
      <h2>{{ lesson.topic }}</h2>
      <p>{{ lesson.location }}</p>
      <p>Price: £{{ lesson.price }}</p>
      <p>Spaces: {{ lesson.space }}</p>
    </div>
  </div>

  <script type="module">
    const { createApp } = Vue

    const SERVER_URL = "https://backend-server-m01031178.onrender.com"

    const myApp = createApp({
      data() {
        return {
          sitename: "After School Club",
          lessons: []
        }
      },
      created() {
        this.fetchLessons()
      },
      methods: {
        async fetchLessons() {
          const url = SERVER_URL + "/lessons"
          let response = await fetch(url)
          this.lessons = await response.json()
        },
        imageAddress(lesson) {
          return SERVER_URL + "/images/" + lesson.image
        }
      }
    })

    myApp.mount("#app")
  </script>
</body>
</html>
